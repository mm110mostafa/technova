<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>آرنوتک | فروشگاه تخصصی لپ‌تاپ و لوازم کامپیوتری</title>
  <meta name="description" content="آرنوتک؛ مرجع تخصصی خرید لپ‌تاپ، لپ‌تاپ گیمینگ، مانیتور، قطعات و لوازم جانبی کامپیوتر با ضمانت اصالت، مشاوره تخصصی و ارسال سریع." />
  <meta name="theme-color" content="#0A1230" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#F4F6FB;font-family:Vazirmatn,system-ui,sans-serif;transition:opacity .6s ease,visibility .6s ease}
    #boot.done{opacity:0;visibility:hidden}
    #boot .b-wrap{display:flex;flex-direction:column;align-items:center;gap:18px}
    #boot .b-logo{display:flex;align-items:center;gap:10px;color:#0A1230;font-weight:900;font-size:26px}
    #boot .b-mark{width:44px;height:44px;border-radius:14px;background:#0A1230;display:grid;place-items:center;box-shadow:0 10px 30px -10px rgba(10,18,48,.6)}
    #boot .b-mark i{width:16px;height:16px;border-radius:50%;background:#FFCB24;box-shadow:0 0 18px #FFCB24}
    #boot .b-bar{width:160px;height:4px;border-radius:9px;background:#E2E6F2;overflow:hidden}
    #boot .b-bar span{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#0A1230,#FFCB24);animation:bslide 1.1s cubic-bezier(.6,0,.4,1) infinite}
    #boot .b-msg{font-size:13px;color:#6B7BBE}
    @keyframes bslide{0%{transform:translateX(150%)}100%{transform:translateX(-250%)}}
  </style>
  <!-- runtime:start -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind.cdn.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1?external=react",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
      "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react,react-dom",
      "zustand": "https://esm.sh/zustand@4.5.5?external=react",
      "zustand/middleware": "https://esm.sh/zustand@4.5.5/middleware?external=react"
    }
  }
  </script>
  <script type="module" src="src/runtime/loader.js"></script>
  <!-- runtime:end -->
</head>
<body class="bg-mist text-ink-900 antialiased">
  <div id="boot" role="status" aria-live="polite">
    <div class="b-wrap">
      <div class="b-logo"><span class="b-mark"><i></i></span>آرنوتک</div>
      <div class="b-bar"><span></span></div>
      <div class="b-msg" id="boot-msg">در حال آماده‌سازی فروشگاه…</div>
    </div>
  </div>
  <div id="root"></div>
</body>
</html>
